<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>声纹克隆 TTS - 语音克隆工具</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        :root {
            --bg: #0f0f13;
            --surface: #1a1a24;
            --surface-2: #22222e;
            --border: #2a2a3a;
            --text: #e8e8f0;
            --text-secondary: #8888a0;
            --primary: #6c5ce7;
            --primary-hover: #7d6ff0;
            --primary-glow: rgba(108, 92, 231, 0.3);
            --success: #00d68f;
            --error: #ff6b6b;
            --warning: #ffd43b;
            --radius: 12px;
            --radius-sm: 8px;
        }
        html { font-size: 15px; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }
        .app-header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
        }
        .app-header .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 700;
            font-size: 1.25rem;
        }
        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--primary), #a78bfa);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
            padding: 0.4rem 0.8rem;
            background: var(--surface-2);
            border-radius: 20px;
            border: 1px solid var(--border);
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-secondary);
            transition: background 0.3s;
        }
        .status-dot.active { background: var(--success); box-shadow: 0 0 8px var(--success); }
        .status-dot.loading { background: var(--warning); animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        .container { max-width: 960px; margin: 0 auto; padding: 0 1.5rem; }

        main { padding: 2rem 0 4rem; }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .card-title {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .upload-zone {
            border: 2px dashed var(--border);
            border-radius: var(--radius);
            padding: 2.5rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }
        .upload-zone:hover, .upload-zone.dragover {
            border-color: var(--primary);
            background: rgba(108, 92, 231, 0.05);
        }
        .upload-zone.has-file {
            border-style: solid;
            border-color: var(--success);
            background: rgba(0, 214, 143, 0.05);
        }
        .upload-zone input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }
        .upload-icon {
            font-size: 2.5rem;
            margin-bottom: 0.75rem;
        }
        .upload-text { color: var(--text-secondary); font-size: 0.9rem; }
        .upload-text strong { color: var(--text); }
        .upload-hint { font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.5rem; }

        .file-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            background: var(--surface-2);
            border-radius: var(--radius-sm);
            margin-top: 0.75rem;
        }
        .file-info .icon { font-size: 1.2rem; }
        .file-info .name { flex: 1; font-size: 0.9rem; font-weight: 500; }
        .file-info .meta { font-size: 0.8rem; color: var(--text-secondary); }
        .file-info .remove-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 0.25rem;
            line-height: 1;
            transition: color 0.2s;
        }
        .file-info .remove-btn:hover { color: var(--error); }

        .voices-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 0.75rem;
        }
        .voice-card {
            background: var(--surface-2);
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 0.75rem 1rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }
        .voice-card:hover { border-color: var(--primary); }
        .voice-card.selected {
            border-color: var(--primary);
            background: rgba(108, 92, 231, 0.1);
        }
        .voice-card .name {
            font-weight: 500;
            font-size: 0.9rem;
            margin-bottom: 0.15rem;
        }
        .voice-card .meta {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        .voice-card .delete-btn {
            float: right;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.9rem;
            padding: 0.1rem;
            transition: color 0.2s;
        }
        .voice-card .delete-btn:hover { color: var(--error); }

        .voice-card .preview-btn {
            background: none;
            border: 1px solid var(--border);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.8rem;
            color: var(--primary);
            transition: all 0.2s;
            float: right;
            margin-left: 0.4rem;
        }
        .voice-card .preview-btn:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .voice-card .preview-btn.playing {
            background: var(--success);
            color: #fff;
            border-color: var(--success);
        }
        .voice-card .date {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 0.1rem;
        }

        .text-input-wrapper {
            position: relative;
        }
        .text-input-wrapper textarea {
            width: 100%;
            min-height: 140px;
            padding: 1rem;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-family: inherit;
            font-size: 0.95rem;
            line-height: 1.7;
            resize: vertical;
            transition: border-color 0.2s;
        }
        .text-input-wrapper textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }
        .text-input-wrapper textarea::placeholder { color: var(--text-secondary); }
        .char-count {
            text-align: right;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 0.4rem;
        }

        .controls-row {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .controls-row select {
            padding: 0.6rem 1rem;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
            min-width: 140px;
        }
        .controls-row select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.65rem 1.5rem;
            border: none;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #a78bfa);
            color: white;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 20px var(--primary-glow);
        }
        .btn-secondary {
            background: var(--surface-2);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover:not(:disabled) {
            background: var(--border);
        }
        .btn-danger {
            background: rgba(255, 107, 107, 0.15);
            color: var(--error);
            border: 1px solid rgba(255, 107, 107, 0.3);
        }
        .btn-danger:hover:not(:disabled) {
            background: rgba(255, 107, 107, 0.25);
        }
        .btn-success {
            background: rgba(0, 214, 143, 0.15);
            color: var(--success);
            border: 1px solid rgba(0, 214, 143, 0.3);
        }
        .btn-success:hover:not(:disabled) {
            background: rgba(0, 214, 143, 0.25);
        }

        .result-card {
            display: none;
        }
        .result-card.visible { display: block; }

        .audio-player {
            width: 100%;
            margin: 0.5rem 0;
        }
        .audio-player audio {
            width: 100%;
            border-radius: var(--radius-sm);
        }

        .action-buttons {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-top: 0.75rem;
        }

        .toast-container {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .toast {
            padding: 0.75rem 1.25rem;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 500;
            animation: slideIn 0.3s ease;
            max-width: 360px;
            backdrop-filter: blur(8px);
        }
        .toast.success { background: rgba(0, 214, 143, 0.2); border: 1px solid rgba(0, 214, 143, 0.4); color: var(--success); }
        .toast.error { background: rgba(255, 107, 107, 0.2); border: 1px solid rgba(255, 107, 107, 0.4); color: var(--error); }
        .toast.info { background: rgba(108, 92, 231, 0.2); border: 1px solid rgba(108, 92, 231, 0.4); color: var(--primary-hover); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .loading-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 15, 19, 0.7);
            backdrop-filter: blur(4px);
            z-index: 999;
            align-items: center;
            justify-content: center;
        }
        .loading-overlay.visible { display: flex; }
        .loading-spinner {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2rem;
            text-align: center;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { color: var(--text-secondary); font-size: 0.9rem; text-align: center; line-height: 1.6; }

        .empty-state {
            text-align: center;
            padding: 1.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        @media (max-width: 640px) {
            .app-header .container { flex-direction: column; gap: 0.5rem; }
            .controls-row { flex-direction: column; }
            .controls-row select { width: 100%; }
            .voices-grid { grid-template-columns: 1fr 1fr; }
            .action-buttons { flex-direction: column; }
            .action-buttons .btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
    <header class="app-header">
        <div class="container">
            <div class="logo">
                <div class="logo-icon">&#9835;</div>
                <span>声纹克隆 TTS</span>
            </div>
            <div class="status-badge">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">初始化中...</span>
            </div>
        </div>
    </header>

    <main>
        <div class="container">

            <!-- 第一步：上传语音 -->
            <div class="card">
                <div class="card-title">&#127908; 第一步 &mdash; 上传语音样本</div>
                <div class="upload-zone" id="uploadZone">
                    <input type="file" id="audioInput" accept=".wav,.mp3,.flac,.ogg,.m4a" />
                    <div class="upload-icon">&#128227;</div>
                    <div class="upload-text">
                        <strong>点击上传</strong> 或拖拽文件到此处<br>
                       （支持 WAV、MP3、FLAC、OGG、M4A 格式）
                    </div>
                    <div class="upload-hint">建议至少 1 秒的清晰语音</div>
                </div>
                <div class="file-info" id="fileInfo" style="display:none;">
                    <span class="icon">&#127925;</span>
                    <span class="name" id="fileName">voice_sample.wav</span>
                    <span class="meta" id="fileMeta"></span>
                    <button class="remove-btn" id="removeFileBtn" title="移除文件">&times;</button>
                </div>
            </div>

            <!-- 第二步：选择声纹 -->
            <div class="card">
                <div class="card-title">&#128305; 第二步 &mdash; 选择声纹</div>
                <div id="voicesContainer">
                    <div class="empty-state" id="emptyVoices">暂无声纹，请先上传语音样本</div>
                    <div class="voices-grid" id="voicesGrid" style="display:none;"></div>
                </div>
            </div>

            <!-- 第三步：输入文字并生成 -->
            <div class="card">
                <div class="card-title">&#9998; 第三步 &mdash; 输入文字并生成语音</div>
                <div class="text-input-wrapper">
                    <textarea id="textInput" placeholder="输入或粘贴要转换的文字..." maxlength="5000"></textarea>
                    <div class="char-count"><span id="charCount">0</span> / 5000</div>
                </div>
                <div class="controls-row" style="margin-top:1rem;">
                    <select id="languageSelect">
                        <option value="zh-cn">简体中文</option>
                        <option value="en">英语</option>
                        <option value="ja">日语</option>
                        <option value="ko">韩语</option>
                        <option value="fr">法语</option>
                        <option value="de">德语</option>
                        <option value="es">西班牙语</option>
                        <option value="ru">俄语</option>
                    </select>
                    <button class="btn btn-primary" id="synthesizeBtn" disabled>
                        &#9654; 生成语音
                    </button>
                    <button class="btn btn-secondary" id="streamBtn" disabled>
                        &#9654; 流式预览
                    </button>
                </div>
            </div>

            <!-- 结果 -->
            <div class="card result-card" id="resultCard">
                <div class="card-title">&#127911; 生成的音频</div>
                <div class="audio-player">
                    <audio id="audioPlayer" controls></audio>
                </div>
                <div class="action-buttons">
                    <button class="btn btn-success" id="downloadBtn">
                        &#11015; 下载
                    </button>
                    <button class="btn btn-secondary" id="playAgainBtn">
                        &#9654; 重新播放
                    </button>
                    <button class="btn btn-secondary" id="clearOutputsBtn">
                        &#128465; 清除输出
                    </button>
                </div>
            </div>

        </div>
    </main>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Generating speech...</div>
        </div>
    </div>

    <audio id="voicePreviewAudio" style="display:none"></audio>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        const state = {
            voices: [],
            selectedVoiceId: null,
            currentAudioUrl: null,
            isGenerating: false
        };

        const elements = {
            statusDot: document.getElementById('statusDot'),
            statusText: document.getElementById('statusText'),
            audioInput: document.getElementById('audioInput'),
            uploadZone: document.getElementById('uploadZone'),
            fileInfo: document.getElementById('fileInfo'),
            fileName: document.getElementById('fileName'),
            fileMeta: document.getElementById('fileMeta'),
            removeFileBtn: document.getElementById('removeFileBtn'),
            voicesGrid: document.getElementById('voicesGrid'),
            emptyVoices: document.getElementById('emptyVoices'),
            textInput: document.getElementById('textInput'),
            charCount: document.getElementById('charCount'),
            languageSelect: document.getElementById('languageSelect'),
            synthesizeBtn: document.getElementById('synthesizeBtn'),
            streamBtn: document.getElementById('streamBtn'),
            resultCard: document.getElementById('resultCard'),
            audioPlayer: document.getElementById('audioPlayer'),
            downloadBtn: document.getElementById('downloadBtn'),
            playAgainBtn: document.getElementById('playAgainBtn'),
            clearOutputsBtn: document.getElementById('clearOutputsBtn'),
            loadingOverlay: document.getElementById('loadingOverlay'),
            loadingText: document.getElementById('loadingText'),
            toastContainer: document.getElementById('toastContainer')
        };

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            elements.toastContainer.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        function showLoading(text = '处理中...') {
            elements.loadingText.textContent = text;
            elements.loadingText.style.whiteSpace = 'pre-line';
            elements.loadingOverlay.classList.add('visible');
        }

        function hideLoading() {
            elements.loadingOverlay.classList.remove('visible');
        }

        async function checkStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                elements.statusDot.className = 'status-dot active';
                elements.statusText.textContent = `模型就绪 (${data.device})`;
                return data;
            } catch {
                elements.statusDot.className = 'status-dot loading';
                elements.statusText.textContent = '连接中...';
                return null;
            }
        }

        async function loadVoices() {
            try {
                const res = await fetch('/api/voices');
                const data = await res.json();
                state.voices = data.voices;
                renderVoices();
            } catch (e) {
                console.error('Failed to load voices:', e);
            }
        }

        function renderVoices() {
            const grid = elements.voicesGrid;
            const empty = elements.emptyVoices;

            if (state.voices.length === 0) {
                grid.style.display = 'none';
                empty.style.display = 'block';
                return;
            }

            empty.style.display = 'none';
            grid.style.display = 'grid';
            grid.innerHTML = state.voices.map(v => {
                const selected = v.id === state.selectedVoiceId;
                const sizeKB = (v.size / 1024).toFixed(0);
                const dateStr = v.created_str || '';
                return `
                    <div class="voice-card ${selected ? 'selected' : ''}" data-id="${v.id}">
                        <button class="delete-btn" data-id="${v.id}" title="删除声纹">&#10005;</button>
                        <button class="preview-btn" data-id="${v.id}" title="预览试听">&#9654;</button>
                        <div class="name">${v.name}</div>
                        <div class="meta">${sizeKB} KB</div>
                        <div class="date">${dateStr}</div>
                    </div>
                `;
            }).join('');

            grid.querySelectorAll('.voice-card').forEach(card => {
                const id = card.dataset.id;
                card.addEventListener('click', (e) => {
                    if (e.target.closest('.delete-btn')) return;
                    if (e.target.closest('.preview-btn')) return;
                    selectVoice(id);
                });
            });

            grid.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const id = btn.dataset.id;
                    if (!confirm('确认删除该声纹？')) return;
                    try {
                        await fetch(`/api/delete-voice/${id}`, { method: 'DELETE' });
                        showToast('声纹已删除', 'info');
                        if (state.selectedVoiceId === id) {
                            state.selectedVoiceId = null;
                            updateSynthesizeButton();
                        }
                        await loadVoices();
                    } catch {
                        showToast('删除声纹失败', 'error');
                    }
                });
            });

            grid.querySelectorAll('.preview-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const id = btn.dataset.id;
                    const audio = document.getElementById('voicePreviewAudio');
                    if (!audio) return;

                    if (audio.dataset.voiceId === id && !audio.paused) {
                        audio.pause();
                        audio.currentTime = 0;
                        btn.classList.remove('playing');
                        btn.innerHTML = '&#9654;';
                        return;
                    }

                    try {
                        const res = await fetch(`/api/voice-audio/${id}`);
                        if (!res.ok) throw new Error('加载失败');
                        const blob = await res.blob();
                        const url = URL.createObjectURL(blob);

                        document.querySelectorAll('.preview-btn').forEach(b => {
                            b.classList.remove('playing');
                            b.innerHTML = '&#9654;';
                        });

                        audio.src = url;
                        audio.dataset.voiceId = id;
                        btn.classList.add('playing');
                        btn.innerHTML = '&#9646;&#9646;';
                        audio.play();

                        audio.onended = () => {
                            btn.classList.remove('playing');
                            btn.innerHTML = '&#9654;';
                        };
                    } catch (err) {
                        showToast('试听失败: ' + err.message, 'error');
                    }
                });
            });
        }

        function selectVoice(id) {
            state.selectedVoiceId = id;
            renderVoices();
            updateSynthesizeButton();
            showToast('声纹选择成功', 'success');
        }

        function updateSynthesizeButton() {
            const hasVoice = !!state.selectedVoiceId;
            const hasText = elements.textInput.value.trim().length > 0;
            elements.synthesizeBtn.disabled = !(hasVoice && hasText);
            elements.streamBtn.disabled = !(hasVoice && hasText);
        }

        // Upload handling
        elements.uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            elements.uploadZone.classList.add('dragover');
        });
        elements.uploadZone.addEventListener('dragleave', () => {
            elements.uploadZone.classList.remove('dragover');
        });
        elements.uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            elements.uploadZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                handleFile(e.dataTransfer.files[0]);
            }
        });
        elements.audioInput.addEventListener('change', () => {
            if (elements.audioInput.files.length) {
                handleFile(elements.audioInput.files[0]);
            }
        });

        elements.removeFileBtn.addEventListener('click', () => {
            elements.audioInput.value = '';
            elements.fileInfo.style.display = 'none';
            elements.uploadZone.classList.remove('has-file');
            elements.uploadZone.querySelector('.upload-text').innerHTML =
                '<strong>点击上传</strong> 或拖拽文件到此处<br>（支持 WAV、MP3、FLAC、OGG、M4A 格式）';
        });

        async function handleFile(file) {
            const validExts = ['.wav', '.mp3', '.flac', '.ogg', '.m4a'];
            const ext = '.' + file.name.split('.').pop().toLowerCase();
            if (!validExts.includes(ext)) {
                showToast('不支持的文件格式', 'error');
                return;
            }

            elements.fileInfo.style.display = 'flex';
            elements.fileName.textContent = file.name;
            elements.fileMeta.textContent = (file.size / 1024).toFixed(0) + ' KB';
            elements.uploadZone.classList.add('has-file');
            elements.uploadZone.querySelector('.upload-text').innerHTML =
                '<strong>已选择文件</strong> &mdash; 准备上传';

            const formData = new FormData();
            formData.append('audio', file);

            showLoading('正在上传语音样本...');
            try {
                const res = await fetch('/api/upload', { method: 'POST', body: formData });
                const data = await res.json();
                if (data.success) {
                    state.selectedVoiceId = data.voice_id;
                    showToast(data.message || '语音上传成功！', 'success');
                    elements.fileMeta.textContent =
                        (file.size / 1024).toFixed(0) + ' KB' +
                        (data.duration ? ` \u00b7 ${data.duration}s` : '');
                    await loadVoices();
                    updateSynthesizeButton();
                } else {
                    showToast(data.error || '上传失败', 'error');
                }
            } catch (e) {
                showToast('上传失败: ' + e.message, 'error');
            } finally {
                hideLoading();
            }
        }

        // Text input
        elements.textInput.addEventListener('input', () => {
            const len = elements.textInput.value.length;
            elements.charCount.textContent = len;
            updateSynthesizeButton();
        });

        // Synthesize
        elements.synthesizeBtn.addEventListener('click', synthesize);
        elements.streamBtn.addEventListener('click', () => synthesize(true));

        async function synthesize(stream = false) {
            const text = elements.textInput.value.trim();
            if (!text || !state.selectedVoiceId) return;

            state.isGenerating = true;
            elements.synthesizeBtn.disabled = true;
            elements.streamBtn.disabled = true;

            const endpoint = stream ? '/api/stream' : '/api/synthesize';
            showLoading('正在生成语音...\n首次使用可能需要 10-30 秒加载模型');

            try {
                if (stream) {
                    const res = await fetch(endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            text,
                            voice_id: state.selectedVoiceId,
                            language: elements.languageSelect.value
                        })
                    });

                    if (!res.ok) {
                        const err = await res.json();
                        throw new Error(err.error || '合成失败');
                    }

                    const blob = await res.blob();
                    const url = URL.createObjectURL(blob);
                    state.currentAudioUrl = url;
                    elements.audioPlayer.src = url;
                    elements.resultCard.classList.add('visible');
                    elements.audioPlayer.play();
                    showToast('语音生成成功！', 'success');
                } else {
                    const res = await fetch(endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            text,
                            voice_id: state.selectedVoiceId,
                            language: elements.languageSelect.value
                        })
                    });

                    const data = await res.json();
                    if (!data.success) {
                        throw new Error(data.error || '合成失败');
                    }

                    state.currentAudioUrl = data.audio_url;
                    elements.audioPlayer.src = data.audio_url;
                    elements.resultCard.classList.add('visible');
                    elements.audioPlayer.play();
                    showToast(data.message || '语音生成成功！', 'success');
                }
            } catch (e) {
                showToast(e.message, 'error');
            } finally {
                hideLoading();
                state.isGenerating = false;
                updateSynthesizeButton();
            }
        }

        // Download
        elements.downloadBtn.addEventListener('click', () => {
            if (state.currentAudioUrl) {
                const a = document.createElement('a');
                a.href = state.currentAudioUrl;
                a.download = 'tts-output.wav';
                a.click();
                showToast('开始下载', 'info');
            }
        });

        elements.playAgainBtn.addEventListener('click', () => {
            if (elements.audioPlayer.src) {
                elements.audioPlayer.currentTime = 0;
                elements.audioPlayer.play();
            }
        });

        elements.clearOutputsBtn.addEventListener('click', async () => {
            try {
                await fetch('/api/clear-outputs', { method: 'POST' });
                showToast('已清除输出', 'info');
                elements.resultCard.classList.remove('visible');
                elements.audioPlayer.removeAttribute('src');
                state.currentAudioUrl = null;
            } catch {
                showToast('清除输出失败', 'error');
            }
        });

        // Init
        async function init() {
            await checkStatus();
            await loadVoices();
            updateSynthesizeButton();
        }

        init();
    </script>
</body>
</html>
